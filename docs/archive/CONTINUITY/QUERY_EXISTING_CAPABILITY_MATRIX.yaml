# QUERY_EXISTING_CAPABILITY_MATRIX.yaml
# Stage 3 — Existing-capability classification for the repository-grounded
# Query IR / control-plane integration audit (2026-08-02).
#
# Classification vocabulary:
#   REUSE_AS_IS              existing module satisfies the capability unchanged
#   EXTEND_EXISTING          existing module gains fields/stages; same owner
#   ADAPT_WITH_WRAPPER       existing module wrapped/normalized for a new contract
#   MERGE_DUPLICATES         two+ existing implementations must converge
#   DEPRECATE                existing behavior retired in favor of replacement
#   CREATE_NEW               no existing equivalent or partial implementation (proof attached)
#   BLOCKED_PENDING_EVIDENCE cannot classify until measured evidence exists
#
# Provenance: repo HEAD 86149227db703c097aad586e4a18018185e9f742,
# branch extraction/deterministic-recall-ladder (dirty tree, PATCH-FROZEN).

audit_date: "2026-08-02"
repository_root: /Users/king/polymath_v3.3
frozen_core_note: >
  Extraction Core v1 is PATCH-FROZEN. Nothing under backend/services/extraction/,
  config/ontology.yaml, config/predicate_synonyms.yaml, or
  config/relation_acceptance.yaml may change without the six-step change-control
  procedure (CONTINUITY/EXTRACTION_FREEZE_MANIFEST_20260802.md).

capabilities:

  query_ir:
    classification: EXTEND_EXISTING
    existing:
      - path: backend/services/retriever/query_plan.py
        symbol: QueryPlanV2 / build_query_plan_v2
        note: deterministic model-free plan; lanes, probes, operators, original-query recall lane
      - path: backend/models/librarian_query_plan.py
        symbol: QueryPlanV1 (librarian_rule_planner.v1)
        note: typed, hashed, replayable librarian artifact with seat budget and refusal signals
    gap: >
      Two plan representations coexist (QueryPlanV2 authoritative, QueryPlanV1
      librarian overlay). A single validated "Query IR" contract = QueryPlanV2
      extended with typed temporal/ontology/obligation fields and a validation
      gate; NOT a new planner.
    proof_no_new_module_needed: both types already serialize into retriever diagnostics

  intent_classification:
    classification: REUSE_AS_IS
    existing:
      - path: backend/services/retriever/intent_policy.py
        symbol: deterministic retrieval-intent policy (QueryNeed BROAD/FOCUSED)
        note: deliberately heuristic, no LLM — same query always same mix

