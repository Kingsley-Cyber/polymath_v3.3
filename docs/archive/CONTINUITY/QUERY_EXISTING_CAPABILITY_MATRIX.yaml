  conversation_context_resolution:
    classification: EXTEND_EXISTING
    existing:
      - path: backend/services/conversation.py
        symbol: conversation_service (history, trim)
      - path: backend/services/chat_orchestrator.py
        symbol: process_chat_request (standalone_query already derived for vocabulary)
    note: plan.standalone_query proves context resolution already feeds the resolver

  vocabulary_resolution_bundle:
