        symbol: CorpusVocabularyResolver.resolve / corpus_vocabulary_resolver
        note: returns untyped dict; per-corpus fanout + global merge + reservations
      - path: backend/services/retriever/vocabulary_cache.py
        symbol: resolution cache (sha256 key + per-corpus epochs)
    gap: >
      Wrap the dict in a typed VocabularyResolutionBundle pydantic model without
      changing resolver behavior; consumers already key on matches/per_corpus/
      document_profiles/raptor_ancestors.

  ontology_query_resolution:
    classification: CREATE_NEW
    existing_partial:
      - path: backend/registries/domain_registry.v1.json (+ domain_resolution_policy.v1.json, domain_superframe_affinity.v1.json)
        note: ingestion-side macro-domain registry; consumed by four_lane associative lane
      - path: backend/models/semantic_resolution.py
        note: T9.1 domain/frame CANDIDATE contracts — ingestion time only
      - path: config/ontology.yaml
        note: predicate ontology — FROZEN, consumed by extraction only
    proof_of_absence: >
      No query-time component maps user terms to canonical entities/predicates/
      classes/roles. grep for ontology consumers shows only extraction
      (spacy_relation_adapter.py, dep_path_extractor.py) and ingestion
      registries. four_lane_router uses digest ontology frames for routing but
      performs no canonical entity/predicate resolution.
    constraint: must NOT duplicate vocabulary resolution; ontology resolver takes
      vocabulary matches as input, not raw user text.

  temporal_compilation:
    classification: EXTEND_EXISTING
    existing:
      - path: backend/services/retriever/temporal.py
        symbol: detect_temporal_intent / TEMPORAL_ROUTING_VERSION temporal_query_routing.v1
