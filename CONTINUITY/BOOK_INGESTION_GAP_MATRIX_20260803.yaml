# Book-Ingestion Gap Matrix — repository-grounded audit
# Generated: 2026-08-03 (audit pass, read-only; no production code modified)
# Evidence sources:
#   data_eval/book_ingestion_pipeline_probe.json   (live Mongo/Neo4j/Qdrant + retrieval probes)
#   data_eval/book_ingestion_pressure_baseline.json (live queue/store/worker census)
# Unmeasured quantities are marked MEASURE_REQUIRED. No percentages as release metrics.

audit:
  schema_version: book_ingestion_gap_matrix.v1
  date: "2026-08-03"
  method: code_trace + live_store_census + live_retrieval_probe
  stores:
    mongo: localhost:27017/polymath
    neo4j: bolt://localhost:7687
    qdrant: http://localhost:6333
  live_census:
    documents: 659            # active 651
    chunks: 395412
    ingestion_runs: {reconciling: 213, query_ready: 357, excluded: 4}
    query_ready_certificates: 357
    corpus_engine_values: {relex_local: 11, runpod_flash: 16, cloud: 1}
    persisted_extraction_models:
      "": 198829
      none: 34925
      urchade/gliner_medium-v2.1: 128933        # ordinary GLiNER, historical
      knowledgator/gliner-relex-large-v0.5: 256
      knowledgator/gliner-relex-large-v1.0: 194
    document_ghost_b_engines: {runpod_local_extraction: 613, relex_local: 7, none: 39}

# ---------------------------------------------------------------- verdicts
verdicts:
  arbitrary_book_ingestion: partial
  mixed_content_routing: passed
  relex_only_extraction: partial
  chunk_summary_generation: failed
  parent_section_summary_generation: failed
  document_summary_generation: failed
  promotion_idempotency: passed
  route_aware_readiness: partial
  restart_recoverability: passed
  one_thousand_file_admission_control: partial
  one_thousand_file_backpressure: partial
  one_thousand_file_recovery: partial
  production_ready: failed

# ---------------------------------------------------------------- gaps
gaps:
  - id: GAP-01
    verdict: chunk_summary_generation
    state: failed
    title: Parent/chunk summaries never execute for Relex books (cost authority gate)
    path: backend/services/ingestion/summary_cost_control.py
    symbols: [SummaryCostAuthorityRequired, summary_cost_run_id]
    evidence:
      - "fixture corpus f842e3b5: parents_with_summary=0/17, summary_jobs {queued:17, blocked_no_parent_summaries:2}"
      - "stage_attempts: run_bounded_corpus_repair_cycle attempt_no=31 failure_class=SummaryCostAuthorityRequired"
      - "summary plan receipts: planned=0 jobs_count=0 (nothing is ever scheduled)"
    missing_behavior: >
      Ingest profiles do not carry summary_cost_authority_usd / summary_cost_run_id,
      so provider-backed summary generation fails closed and the reconciler's
      summary_ids census never clears.
    required_test: >
      test_summary_cost_authority_roundtrip: ingest a fixture with a valid
      summary_cost_run_id, assert parent_chunks.summary populated for every
      retrieval_parent and the repair cycle reports planned>0.

  - id: GAP-02
    verdict: parent_section_summary_generation
    state: failed
    title: Summary tree (parents/rollups/sections) never materialized
    path: backend/services/ingestion/summary_tree.py
    symbols: [TREE_SCHEMA_VERSION, build_summary_tree]
    evidence:
      - "documents_with_summary_tree_sections=0 on both fixture corpora"
      - "summary_tree collection count for fixture corpus = 0"
    missing_behavior: >
      The deterministic tree builder exists and is unit-tested, but the runtime
      only invokes it after LLM summary rows exist; with GAP-01 blocking, no
      section rollups or document profile are ever produced for new books.
    required_test: >
      test_summary_tree_materializes_after_parent_summaries: stub llm_fn,
      assert summary_tree sections/rollups/profile written and embedded.

  - id: GAP-03
    verdict: document_summary_generation
    state: failed
    title: Document-level summary (doc_profile.summary) absent on new books
    path: backend/services/ingestion/document_summaries.py
    evidence:
      - "documents_with_profile=0/2 on fixture corpus f842e3b5"
    missing_behavior: Same root cause chain as GAP-01/GAP-02.
    required_test: >
      test_document_profile_summary_written: assert documents.doc_profile.summary
      non-empty and linked to section rollup IDs after tree completion.

  - id: GAP-04
    verdict: arbitrary_book_ingestion
    state: partial
    title: Binary/scanned formats hard-fail while Docling sidecar is off
    path: backend/services/ingestion/docling_adapter.py
    symbols: [_sidecar_disabled, _docling_required_error, DOCLING_SIDECAR_POLICY]
    evidence:
      - ".env DOCLING_SIDECAR_POLICY=off -> _sidecar_disabled() True"
      - ".epub/.docx/scanned-PDF raise RuntimeError('needs the Docling sidecar')"
      - "sidecar parse posts do_ocr=false; OCR lane is disabled end-to-end"
    missing_behavior: >
      .md/.txt/.html/fast-text-PDF ingest fully; .epub/.docx/.pdf(scanned)/images
      are rejected at parse with an operator-facing error, and no OCR lane exists
      anywhere in the live configuration.
    required_test: >
      test_parse_policy_matrix: for each extension, assert the expected lane
      (fast path | docling sidecar | explicit fail) and that fail is durable +
      retryable via source_parse_jobs.

  - id: GAP-05
    verdict: relex_only_extraction
    state: partial
    title: Persisted estate still carries non-canonical engine values and artifacts
    path: backend/services/ingestion/extraction_contract.py
    symbols: [CANONICAL_ENGINE]
    evidence:
      - "corpora.default_ingestion_config.extraction_engine: runpod_flash=16, cloud=1"
      - "documents.ghost_b_metrics.engine: runpod_local_extraction=613"
      - "ghost_b_extractions model=urchade/gliner_medium-v2.1 count=128933"
      - "backend/contracts.py:90 extractor Literal still lists gliner_glirel_local/cloud_llm"
    missing_behavior: >
      Runtime is Relex-only (invariant test forbids ordinary-GLiNER/GLiREL/fallback
      tokens; relex_local fails closed), but the migration list below has not been
      executed: legacy corpus engine values, document engine stamps, and 128,933
      historical extraction rows remain in authoritative stores.
    required_test: >
      test_engine_estate_canonical: after migration script, assert corpus engine
      values == {relex_local}, no document ghost_b_metrics.engine outside
      {relex_local}, and no extraction row references an ordinary-GLiNER model
      for an active document.

  - id: GAP-06
    verdict: route_aware_readiness
    state: partial
    title: Readiness machinery correct but unreachable end state for new books
    path: backend/services/ingestion/readiness.py
    symbols: [READINESS_SCHEMA_VERSION=corpus_readiness.v2, SUMMARY_SCOPES]
    evidence:
      - "fixture corpus readiness: status=extraction_pending blocking=[extraction_jobs_pending, summary_jobs_pending, retrieval_parent_summaries_pending, ...]"
      - "ingestion_runs: reconciling=213; fixture runs have certificate_id=None proof.query_ready=false"
    missing_behavior: >
      corpus_readiness.v2 computes route-aware blocking reasons accurately, but
      because GAP-01 blocks the summary gate, no Relex corpus can transition to
      query_ready; readiness is observed as a diagnostic, not a reachable state.
    required_test: >
      test_readiness_reaches_query_ready_with_cost_authority: fixture ingest with
      authority -> readiness.status=query_ready, certificate issued, route-specific
      readiness flags asserted.

  - id: GAP-07
    verdict: one_thousand_file_admission_control
    state: partial
    title: Admission bounds exist but are unverified at 1,000-file scale
    path: backend/services/ingestion/admission.py
    evidence:
      - "worker env: INGEST_MAX_PARSE_JOBS=2 INGEST_MAX_ACTIVE_JOBS=6 INGEST_MAX_MODEL_PHASE_DOCS=1"
      - "upload batches capped at 25 files (backend/routers/ingestion.py)"
      - "INGEST_RSS_SOFT_LIMIT_RATIO unset in worker env"
    missing_behavior: >
      Bounded semaphores + batch caps + leases exist; no measured evidence of
      behavior under a 1,000-file burst, and no RSS/disk pressure admission is
      configured in the running worker.
    required_test: benchmark_book_ingestion_pressure.py --files 1000 (MEASURE_REQUIRED).

  - id: GAP-08
    verdict: one_thousand_file_backpressure
    state: partial
    title: Durable queues grow unbounded upstream of fixed-capacity workers
    path: backend/services/ingestion/worker.py
    symbols: [_PARSE_SEMAPHORE, _MODEL_PHASE_SEMAPHORES, AdjustableSemaphore]
    evidence:
      - "extraction_jobs queued=1702; summary_jobs queued=13150, running=1"
      - "model phase concurrency = 1 document -> single serialized bottleneck"
    missing_behavior: >
      Mongo-backed queues are durable (good) but there is no producer-side
      admission that slows intake as queue depth grows; under 1,000 files,
      enqueue rate >> drain rate with model_phase_docs=1.
    required_test: >
      Load test recording queue-depth trajectory, p95 stage latency, and worker
      RSS across 1/10/100/1000 files (MEASURE_REQUIRED).

  - id: GAP-09
    verdict: one_thousand_file_recovery
    state: partial
    title: Dead letters and blocked states do not self-heal
    path: backend/services/ingestion/job_leases.py
    symbols: [DEFAULT_JOB_MAX_ATTEMPTS=5, DEAD_LETTER_JOB_STATUS]
    evidence:
      - "document_pipeline_jobs: dead_letter=4, blocked_mongo_state=8, failed=2"
      - "graph_promotion_jobs: blocked_no_extractions=9, failed=1"
      - "213 ingestion_runs stuck reconciling with no automatic drain"
    missing_behavior: >
      Lease expiry re-queues interrupted jobs and attempts cap at dead-letter,
      but terminal/blocked states require operator commands; no reconciler
      auto-repair is observed draining them.
    required_test: >
      test_dead_letter_triage_and_repair_commands: document + execute the exact
      recovery command per terminal state; assert re-entry to queued.

# ---------------------------------------------------------------- relex-only end state (Part 5)
relex_only_end_state:
  registered_production_extraction_engines: 1
  canonical_engine: relex_local
  ordinary_gliner_runtime_paths: 0          # enforced by test_relex_only_runtime_invariant.py
  glirel_runtime_paths: 0                   # only in _schemas_legacy/contracts/migrate script
  fallback_paths: 0                         # RelexUnavailableError -> fail closed
  provider_pool_dependency: false           # extraction; summary pool is a separate concern
  relex_unavailable_behavior: fail_closed
  persisted_residuals:
    corpus_engine_values_noncanonical: 17   # runpod_flash=16, cloud=1
    documents_engine_runpod_local_extraction: 613
    historical_ordinary_gliner_extraction_rows: 128933
    contracts_literal_legacy_values: backend/contracts.py:90  # quarantine accounting only
  migration_and_removal_list:
    - step: 1
      action: Re-run backend/scripts/migrate_engine_to_relex_local.py for the 17 non-canonical corpora
      destructive: false
    - step: 2
      action: Backfill re-extraction only for active documents whose retrievable claims trace to ordinary-GLiNER rows (128,933 rows; prioritize active docs)
      destructive: false
    - step: 3
      action: Update documents.ghost_b_metrics.engine stamps for migrated docs
      destructive: false
    - step: 4
      action: Remove gliner_glirel_local/cloud_llm from contracts.py:90 Literal after quarantine accounting completes
      destructive: false
    - step: 5
      action: Archive (do not delete during audit) historical ordinary-GLiNER extraction rows behind a tombstone flag
      destructive: false

# ---------------------------------------------------------------- content-kind matrix (Part 2)
content_matrix:
  # status: complete | partial | absent
  prose:            {detection: structure-preserving chunker, chunk_kind: body, lane: relex_prose, status: complete}
  heading:          {detection: markdown/parser heading level, chunk_kind: body, lane: none(section_boundary), status: complete}
  list:             {detection: chunker line classifier, chunk_kind: body, lane: relex_prose, status: partial, note: no dedicated list kind}
  table:            {detection: pipe/html-table detection, chunk_kind: table, lane: table_lane, status: complete}
  caption:          {detection: "_CAPTION_LINE_RE ^(Figure|Table|Listing|Example)\\s+\\d", chunk_kind: caption, lane: adjacency_EXPLAINS, status: complete}
  code:             {detection: content-based code_splitter (language-agnostic), chunk_kind: code, lane: code_lane_symbols, status: complete}
  console_output:   {detection: output-block heuristics (Slice 1), chunk_kind: output, lane: adjacency_EXPLAINS, status: complete, note: only 3 rows corpus-wide, no PDF lane}
  formula:          {detection: none, chunk_kind: body, lane: none, status: absent, note: no formula/image/formula-OCR kind in ChunkKind}
  power_fx:         {detection: none, status: absent}
  power_apps_yaml:  {detection: none, status: absent}
  json_yaml_data:   {detection: extension-based only in format_router, chunk_kind: code, lane: code_lane, status: partial, note: not content-detected inside prose formats}
  figure:           {detection: none, status: absent, note: images stripped by _IMG_MD_RE in docling_adapter}
  diagram:          {detection: none, status: absent}
  image:            {detection: stripped, status: absent}
  ocr_text:         {detection: none, status: absent, note: do_ocr=false everywhere; no OCR lane configured}
  ocr_derived_code: {detection: none, status: absent}
  bibliography:     {detection: section_classifier, chunk_kind: bibliography, lane: excluded_from_prose_extraction, status: complete}
  table_of_contents: {detection: section_classifier, chunk_kind: toc, lane: excluded, status: complete}
  index:            {detection: section_classifier, chunk_kind: index, lane: excluded, status: complete}
  footnote_endnote: {detection: none, chunk_kind: body, status: partial, note: folded into prose; no footnote kind}
  code_detection_content_based: verified  # code_splitter detects by content, not extension

# ---------------------------------------------------------------- summary hierarchy (Part 3)
summary_hierarchy:
  child_chunk_record:     {generator: deterministic(chunker), storage: chunks, status: present_on_new_books}
  parent_summary:         {generator: LLM(llm_fn) gated by summary_cost_run_id, storage: parent_chunks.summary, status: ABSENT_on_new_books}
  section_summary:        {generator: summary_tree rollup/section, storage: summary_tree + documents.summary_tree, status: ABSENT_on_new_books}
  document_summary:       {generator: summary_tree profile, storage: documents.doc_profile.summary, status: ABSENT_on_new_books}
  entity_card:            {generator: deterministic from Relex mentions, storage: Neo4j (release-gated), status: present}
  claim_fact_summary:     {generator: deterministic consolidation + corroboration gate, storage: ghost_b_extractions, status: present}
  code_symbol_summary:    {generator: code_lane symbol index, storage: chunks.metadata.symbols_defined, status: present}
  table_summary:          {generator: table lane digest, storage: chunks metadata, status: partial}
  image_ocr_summary:      {generator: none, status: absent}
  deterministic_structure: backend/services/ingestion/summary_tree.py TREE_SCHEMA_VERSION=polymath.summary_tree.v1
  failed_summary_blocks_query_ready: true   # readiness SUMMARY_SCOPES gate

# ---------------------------------------------------------------- control plane (Part 6)
control_plane:
  run_states: [intake, reconciling, query_ready, degraded, excluded]
  legal_transitions: intake->reconciling->query_ready|degraded; excluded is terminal
  lease_collection: ingest_lane_leases
  max_attempts: 5
  dead_letter_status: dead_letter
  duplicate_prevention: stage_identity.v1 source_file_hash + superseded statuses
  observed_live:
    reconciling_stuck: 213
    dead_letter_document_pipeline: 4
    blocked_mongo_state: 8
    graph_promotion_blocked_no_extractions: 9
  route_specific_readiness: true   # corpus_readiness.v2 per-scope SUMMARY_SCOPES
  blocked_graph_write_keeps_retrieval: true  # Neo4j promotion is release-gated and separable

# ---------------------------------------------------------------- pressure (Part 7)
pressure:
  bounded_queues: durable Mongo job collections (unbounded depth, bounded workers)
  semaphores: {parse: 2, active_jobs: 6, model_phase_docs: 1, qdrant_writes: bounded, neo4j_writes: bounded}
  leases: true
  dead_letter: true
  backoff: exponential retry via job_leases
  circuit_breakers: none_observed
  rss_pressure_config: unset (INGEST_RSS_SOFT_LIMIT_RATIO null)
  disk_pressure: backend/services/ingestion/storage_pressure.py present, admission wiring MEASURE_REQUIRED
  per_corpus_fairness: not_observed
  unbounded_risks:
    - summary_jobs queued=13150 with running=1 (single-flight model phase)
    - extraction_jobs queued=1702
    - no producer-side throttle as queue depth grows
  throughput: all MEASURE_REQUIRED (see data_eval/book_ingestion_pressure_baseline.json)
