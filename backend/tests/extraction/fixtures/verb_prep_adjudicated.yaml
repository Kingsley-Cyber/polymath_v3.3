# E — Verb-preposition fixture corpus
#
# Tests each p2_verb_prep resolver rule separately via the frame extractor.
# Rules: work+for→works_for, serve+in→member_of, base+in→located_in,
#        member+of→member_of, part+of→part_of
#
# Required measurements per rule:
#   eligible positive count, correct pair recovery, correct canonical predicate,
#   hard-negative rejection, new candidate count, review count,
#   false-positive count, latency delta
#
# Causal assertion: E − D → only feature_group=p2_verb_prep records
#
# Promotion gate:
#   10-15 positives per rule
#   15-20 adversarial negatives per rule (shared across rules)
#   no false-positive canonical mappings from negatives
#   no unrelated predicate changes

