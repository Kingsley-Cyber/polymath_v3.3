# CORE ontology — the universal semantic backbone.
#
# Owner architecture 2026-08-12 (second-brain design): a corpus is NOT an
# ontology. One corpus may hold fifty domains, so domain packs must COMPOSE
# with this core, never replace it.
#
# Measured failure this replaced: film_production REPLACED the global
# vocabulary, so the corpus lost Location, Event and TimeReference outright
# — zero of each across 6,000 sampled rows in a film-history library full of
# "shot in Budapest", "premiered in 1975", "at Cannes".
#
# Keep this SMALL. It is present on every chunk, and a zero-shot encoder
# discriminates concrete labels well and abstract ones badly. Everything
# here is concrete enough to be found without context.
schema_version: polymath.core_ontology.v1
domain: core

entity_types:
  - Person
  - Organization
  - Location
  - Product
  - Technology
  - Concept
  - Event
  - Document
  - Method
  - TimeReference

# EXTRACTED relations only — what the model is asked to find in prose.
#
# Deliberately ABSENT:
#   related_to   never a canonical edge. An unresolved pair is provenance
#                (predicate=null, status=unresolved), not A-[:RELATED_TO]->B,
#                or the graph accumulates exactly the semantic garbage this
#                pipeline exists to prevent.
#   instance_of  DERIVED from entity typing, not rediscovered from prose.
#                GLiNER returning type=Director already implies
#                Nolan INSTANCE_OF Director IS_A Person.
#
# Direction is canonical: `precedes`, never `preceded_by`. Exactly one
# storage orientation per relation; the adapter inverts extractions that
# arrive the other way round.
relation_types:
  - part_of
  - uses
  - created_by
  - located_in
  - causes
  - precedes
  - references

predicates:
  created_by:
    allowed_pairs:
      - [Document, Person]
      - [Document, Organization]
      - [Product, Organization]
      - [Technology, Organization]
      - [Technology, Person]
      - [Method, Person]
  located_in:
    allowed_pairs:
      - [Event, Location]
      - [Location, Location]
      - [Organization, Location]
      - [Person, Location]
  part_of:
    allowed_pairs:
      - [Concept, Concept]
      - [Location, Location]
      - [Organization, Organization]
      - [Product, Product]
      - [Technology, Technology]
  precedes:
    allowed_pairs:
      - [Event, Event]
      - [Method, Method]
      - [Technology, Technology]
  references:
    allowed_pairs:
      - [Document, Concept]
      - [Document, Document]
      - [Document, Person]
  uses:
    allowed_pairs:
      - [Method, Technology]
      - [Organization, Technology]
      - [Person, Method]
      - [Person, Technology]
      - [Product, Technology]
      - [Technology, Method]
      - [Technology, Technology]
