# --- NOISE VERBS (do NOT map — cognitive/perceptual, no graph edge) ---
# see, want, find, know, feel, think, say, ask, tell, learn, try, keep,
# go, come, look, get, do, consider, understand, focus, suggest,
# choose, examine, start, set, work, click, reach

# ===========================================================================
# SUPPRESSION CONFIG — false-edge prevention (precision guards)
# Every suppression increments a named counter. Nothing dropped silently.
# These are loaded and validated at config load time (fail LOUD).
# ===========================================================================
suppression:
  # --- Attribution: relations inside ccomp/xcomp of these verbs are
  #     attributed (someone SAYS/BELIEVES X), not asserted as fact. ---
  attribution_verbs:
    - argue
    - claim
    - suggest
    - report
    - believe
    - propose
    - hypothesize
    - note
    - observe
    - find
    - show
    - demonstrate
    - contend
    - assert
    - maintain
    - insist
    - allege
    - speculate
    - theorize
    - posit

  # --- Conditional/hypothetical: advcl governed by mark in this set
  #     means relations inside that clause are non-asserted. ---
  conditional_markers:
    - if
    - unless
    - when
    - should
    - were
    - suppose
    - assuming
    - provided
    - whenever

  # --- Contrast: entities inside these phrases must NOT be bound as
  #     subject of the main clause predicate. ---
  contrast_prepositions:
    - unlike
    - versus
    - vs
  contrast_conjunctions:
    - whereas
    - while
    - although
    - though

  # --- Light verbs: predicate lemma in this set whose dobj is an
  #     eventive noun → do NOT map the light verb. ---
  light_verbs:
    - make
    - take
    - give
    - do
    - have

  # --- Low-parse-confidence: ratio of sentence-final punctuation (.!?)
  #     to token count below this threshold → skip relation extraction. ---
  low_parse_confidence_threshold: 0.02
