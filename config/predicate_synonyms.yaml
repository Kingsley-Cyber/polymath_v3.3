# Predicate Synonym Normalization
# Maps surface predicate lemmas to Ghost B schema predicates.
# Values MUST be one of the 31 Predicate Literal values in ghost_b_schemas.py:
#
#   Structural:    part_of, member_of, located_in, works_for, created_by, owns, affiliated_with
#   Canonical:     synonym_of, instance_of
#   Operational:   uses, runs_on, trained_on, references, implements, depends_on,
#                  produces, stores, detects, supports
#   Referential:   defines, represents, maps_to
#   Temporal:      preceded_by, causes, overlaps
#   Provenance:    derived_from, contradicts, excepts, overrides
#   Sentinel:      related_to
#
# Cross-ref with config/ontology.yaml allowed_pairs for type gating.
#
# RESOLUTION ORDER (4-tier composite resolver in dep_path_extractor.py):
#   T1: (signature_contains, lemma, subj_type, obj_type) — most specific
#   T2: (signature_contains, lemma) — signature-aware (copular, passive)
#   T3: (lemma) — flat synonym dict below, last resort
#   T4: None — DROP. Never manufacture predicates via lemma.upper().
#
# CORPUS-DRIVEN: Top lemmas from 90k claims (10k extraction docs):
#   be(29.5%) have(6.2%) use(4.8%) make(3.0%) show(2.7%)
#   create(1.6%) need(1.5%) provide(1.2%) help(1.2%) lead(1.0%)
#   increase(1.0%) allow(0.8%) include(0.8%) affect(0.7%) require(0.5%)
#
# NOISE VERBS (cognitive/perceptual — excluded from graph):
#   see, want, find, know, feel, think, say, ask, tell, learn, try, keep

# ===========================================================================
# T1/T2: SIGNATURE-AWARE RULES (checked BEFORE flat synonyms)
# Structural tiers — ordering within a tier is NOT load-bearing.
# Ties broken alphabetically by predicate (deterministic).
#
# Fields:
#   signature_contains: substring matched against the compact dep-path
#     signature (e.g. "nsubj-VERB-dobj", "nsubjpass-VERB-agent-pobj")
#   lemma: verb lemma (empty = any)
#   subj_type / obj_type: entity type constraint (empty = any)
#     Both specified = T1 (most specific). One or zero = T2.
#   predicate: result, or __DROP__ to suppress the edge
#   swap: true = grammatical subject is semantic object (passive/agent)
#
# Seeded from docs/baselines/DEPENDENCY_PATTERN_MINING_REPORT.json:
#   nsubj-VERB-dobj            freq=2512
#   nsubj-VERB-prep-pobj       freq=681
#   nsubj-VERB-attr            freq=412
#   nsubj-VERB-xcomp-VERB-dobj freq=384
#   nsubjpass-VERB-agent-pobj  freq=377
#   nsubj-VERB-acomp           freq=266
# ===========================================================================
signature_rules:
  # --- Copular: "X is a Y" (nominal complement via attr, freq=412) ---
  - signature_contains: "attr"
    lemma: "be"
    predicate: "instance_of"
  # --- Copular: "X is fast" (adjectival complement, freq=266) → DROP ---
  - signature_contains: "acomp"
    lemma: "be"
    predicate: "__DROP__"
  # --- Copular: "X is running" (verbal complement, freq=384) → DROP ---
  - signature_contains: "xcomp"
    lemma: "be"
    predicate: "__DROP__"
  # --- Copular prepositional: "X is in Y" → located_in ---
  - signature_contains: "prep:in"
    lemma: "be"
    predicate: "located_in"
  - signature_contains: "prep:at"
    lemma: "be"
    predicate: "located_in"
  # --- Copular prepositional: "X is by Y" → created_by, swap ---
  - signature_contains: "prep:by"
    lemma: "be"
    predicate: "created_by"
    swap: true
  # --- Passive with agent: "X was built by Y" → created_by, swap (freq=377) ---
  - signature_contains: "nsubjpass"
    lemma: "be"
    predicate: "created_by"
    swap: true
  # --- Passive lexical: "X was acquired by Y" → owns, swap ---
  - signature_contains: "nsubjpass"
    lemma: "acquire"
    predicate: "owns"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "create"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "build"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "develop"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "design"
    predicate: "created_by"
    swap: true
  # --- P2A resolver coverage: creative-authorship passives ---
  # "X was written by Y" / "X was directed by Y" are unambiguous
  # creative-authorship assertions. Semantically justified for created_by.
  - signature_contains: "nsubjpass"
    lemma: "write"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "direct"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "author"
    predicate: "created_by"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "publish"
    predicate: "produces"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "release"
    predicate: "produces"
    swap: true
  - signature_contains: "nsubjpass"
    lemma: "replace"
    predicate: "preceded_by"
    swap: true
  # --- Causal with type context (T1: both types specified) ---
  - signature_contains: "dobj"
    lemma: "lower"
    predicate: "causes"
  - signature_contains: "dobj"
    lemma: "raise"
    predicate: "causes"
  - signature_contains: "dobj"
    lemma: "reduce"
    predicate: "causes"
  - signature_contains: "dobj"
    lemma: "increase"
    predicate: "causes"
  - signature_contains: "dobj"
    lemma: "decrease"
    predicate: "causes"
  # --- Prepositional verb patterns (freq=681 family) ---
  - signature_contains: "prep:on"
    lemma: "depend"
    predicate: "depends_on"
  - signature_contains: "prep:on"
    lemma: "rely"
    predicate: "depends_on"
  - signature_contains: "prep:on"
    lemma: "run"
    predicate: "runs_on"
  - signature_contains: "prep:on"
    lemma: "train"
    predicate: "trained_on"
  - signature_contains: "prep:from"
    lemma: "derive"
    predicate: "derived_from"
  - signature_contains: "prep:from"
    lemma: "extract"
    predicate: "derived_from"
  - signature_contains: "prep:with"
    lemma: "compare"
    predicate: "uses"
  # --- P2B: Verb-plus-preposition constructions ---
  # Store the complete predicate lemma context. These are high-precision
  # because the preposition disambiguates the verb's sense.
  # works_for: T2 rule with obj_type constraint. Without it, "works for hours"
  # and "works for a living" produce false employment edges. The obj_type is
  # evaluated against ontology-normalized types (ENTITY_TYPE_ALIASES in
  # canonical.py folds all upstream variants like "institution", "company",
  # "agency" into "Organization" before the resolver sees them).
  - signature_contains: "prep:for"
    lemma: "work"
    obj_type: "Organization"
    predicate: "works_for"
    feature_group: "p2_verb_prep"
  - signature_contains: "prep:in"
    lemma: "serve"
    predicate: "member_of"
    feature_group: "p2_verb_prep"
  # NOTE: "base in" → located_in is NOT here. It resolves via T3 synonym
  # (line ~471: "base: located_in"). Adding a T2 rule would be redundant
  # and would NOT add extraction coverage. The passive prep-object frame
  # ("is based in") is gated behind p2_verb_prep at the frame level.
  - signature_contains: "prep:of"
    lemma: "member"
    predicate: "member_of"
    feature_group: "p2_verb_prep"
  - signature_contains: "prep:of"
    lemma: "part"
    predicate: "part_of"
    feature_group: "p2_verb_prep"
  # --- Purpose-PP guard: object inside prep:for is a purpose/benefactive,
  #     NOT a direct semantic object of the verb. DROP. ---
  - signature_contains: "prep:for"
    lemma: "use"
    predicate: "__DROP__"
  - signature_contains: "prep:for"
    lemma: "depend"
    predicate: "__DROP__"

synonyms:
  # --- data-flow verbs (general technical usage; mirrors the independently
  # frozen Meridian matching lexicon: consumes <- read/reads; uses <- write to) ---
  read: consumes
  reads from: consumes
  read from: consumes
  write to: uses
  writes to: uses
  written to: uses
  maintain: supports
  # spec-metadata keys whose wording itself names the canonical relation
  related framework: related_to
  related to: related_to
  # --- transfer-verb policy (owner-delegated decision, 2026-08-07): directed
  # transfer maps the DESTINATION as uses (same frame as "writes to") and the
  # SOURCE as consumes (same frame as "reads from"). Phrase keys only — a bare
  # transfer verb without its complement stays an open relation.
  send to: uses
  sends to: uses
  sent to: uses
  deliver to: uses
  delivers to: uses
  forward to: uses
  forwards to: uses
  push to: uses
  pushes to: uses
