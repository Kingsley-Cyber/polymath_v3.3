# GLiNER-Relex host-MPS sidecar — full release pin (owner-ordered 2026-08-08).
# The sidecar owns model compatibility; downstream consumes only the
# relex-infer-v1 output contract. Same doctrine as the entity encoder:
# the threshold is a release property, never a shared constant.
release: relex-large-mps-sidecar-v1
role: bakeoff_candidate            # NOT production; integration experiment pending
model:
  id: knowledgator/gliner-relex-large-v1.0
  revision: 4aedc9226a5ac9e2f6b5ea3e91c1ee577c88a290
  weights_sha256: 7c5bd751e1b24e4254d70fe4355a986cd65400676ce3735f7752429fcc26960a
runtime:
  device: mps                       # GPU required; server refuses silent CPU fallback
  interpreter: .venv-relex          # gliner 0.2.28, torch 2.13.0, transformers 5.13.1
  host: 127.0.0.1
  port: 8737                        # containers reach it via host.docker.internal:8737
thresholds:
  entity: 0.30
  relation: 0.30
labels:
  # Owner's universal inventory + 18 canonical predicates (2026-08-08).
  # Callers may override per request; these are the defaults the bake-off measured.
  entities: [person, organization, location, product, software, model,
             document, dataset, concept, method, process, event, metric,
             system, component, other]
  relations: ["is a", "part of", "owns", "member of", "created by",
              "located in", "uses", "depends on", "implements", "supports",
              "produces", "consumes", "derived from", "defines", "measures",
              "causes", "enables", "precedes"]
output_contract: relex-infer-v1
measured:
  seconds_per_chunk_mps: 0.31-0.33   # ~100-word chunks, M-series Metal
  seconds_per_chunk_host_cpu: 0.55
