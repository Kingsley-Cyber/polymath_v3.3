# Assertion-context layer — declarative membership (owner-authorized
# systematic completion, 2026-08-08). The CODE owns the grammatical
# mechanisms (inversion detection, mark inspection, governor walks,
# imperative shape); this registry owns only class members.
conditional_markers_extra: [provided, providing, assuming, supposing, whenever]
inversion_auxiliaries: [had, were, should]
